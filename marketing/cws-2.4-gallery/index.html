<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TabShow 2.4 · Chrome Web Store gallery</title>
  <style>
    @font-face {
      font-family: "Inter Local";
      src: url("../video/tabshow-install-2026-09/assets/fonts/Inter-Variable.ttf") format("truetype");
      font-style: normal;
      font-weight: 100 900;
      font-display: block;
    }
    :root {
      font-family: "Inter Local", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      color: #211d42;
      background: #f7f3e9;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --ink: #211d42;
      --muted: #655e77;
      --paper: #fffdf7;
      --canvas: #f7f3e9;
      --accent: #c95618;
      --rule: #dcd5c8;
    }
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 800px; padding: 0; margin: 0; overflow: hidden; }
    .canvas { position: relative; width: 1280px; height: 800px; background: var(--canvas); overflow: hidden; }
    .canvas.ink { --ink: #fffdf7; --muted: #d2cde0; --canvas: #211d42; --accent: #ffb36d; --rule: #534d6c; color: var(--ink); }
    .header { position: absolute; inset: 32px 64px auto; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; gap: 12px; align-items: center; font-size: 24px; font-weight: 760; letter-spacing: -0.7px; }
    .brand img { width: 36px; height: 36px; border-radius: 9px; }
    .edition { color: var(--muted); font-size: 15px; font-weight: 550; letter-spacing: 0.1px; }
    .copy { position: absolute; top: 153px; left: 64px; width: 640px; }
    .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 15px; font-weight: 700; margin: 0 0 26px; }
    .eyebrow::before { content: ""; width: 32px; height: 3px; background: var(--accent); }
    h1 { margin: 0; color: var(--ink); font-size: 62px; line-height: 1.055; font-weight: 760; letter-spacing: -3px; }
    h1 em { color: var(--accent); font-style: normal; }
    .description { width: 560px; margin: 28px 0 0; color: var(--muted); font-size: 25px; line-height: 1.45; letter-spacing: -0.5px; }
    .detail { max-width: 540px; margin: 24px 0 0; color: var(--muted); font-size: 18px; line-height: 1.5; }
    .detail strong { color: var(--ink); font-weight: 650; }
    .steps { margin: 30px 0 0; padding: 0; display: grid; gap: 16px; list-style: none; }
    .steps li { display: flex; gap: 16px; align-items: center; color: var(--muted); font-size: 22px; }
    .steps b { color: var(--ink); font-weight: 650; }
    kbd { display: inline-flex; min-width: 98px; height: 45px; align-items: center; justify-content: center; border: 1px solid var(--rule); border-bottom-width: 3px; border-radius: 8px; color: var(--ink); font: 650 19px/1 "Inter Local", sans-serif; }
    .screenshot { position: absolute; margin: 0; display: flex; align-items: flex-start; justify-content: center; }
    .panel-shot { top: 112px; right: 64px; width: 440px; height: 610px; }
    .screenshot img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 12px 35px #17102020; }
    .ink .screenshot img { box-shadow: 0 12px 35px #00000035; }
    .footer { position: absolute; left: 64px; right: 64px; bottom: 29px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 17px; color: var(--muted); font-size: 16px; }
    .proof { display: flex; gap: 19px; align-items: center; }
    .proof span + span::before { content: "·"; margin-right: 19px; color: var(--accent); }
    .sequence { font-size: 13px; letter-spacing: 1px; }
    .preview .copy { top: 88px; width: 1152px; }
    .preview h1 { font-size: 52px; line-height: 1.12; letter-spacing: -2.3px; }
    .preview .description { width: 1152px; margin-top: 13px; font-size: 22px; }
    .browser-shot { top: 205px; left: 64px; width: 1152px; height: 516px; align-items: center; }
    .browser-shot img { max-width: 1152px; max-height: 516px; }
    .setting-label { margin: 29px 0 0; max-width: 560px; padding-left: 18px; border-left: 3px solid var(--accent); color: var(--ink); font-size: 21px; line-height: 1.5; font-weight: 650; }
    #capture-status { position: absolute; z-index: 10; left: 64px; right: 64px; bottom: 98px; padding: 14px 18px; border: 1px solid #bf4c29; border-radius: 8px; background: #fff0d8; color: #642a16; font: 600 16px/1.4 "Inter Local", sans-serif; }
    #capture-status[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="canvas" id="canvas" aria-label="TabShow product screenshot">
    <header class="header">
      <div class="brand"><img src="../../public/icon/96.png" alt=""><span>TabShow</span></div>
      <span class="edition">Live tab preview for Chrome · 2.4</span>
    </header>
    <section class="copy" aria-labelledby="headline">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="headline"></h1>
      <p class="description" id="description"></p>
      <div id="extra"></div>
    </section>
    <figure class="screenshot panel-shot" id="screenshot-frame"><img id="product-image" alt=""></figure>
    <footer class="footer">
      <div class="proof"><span>Free</span><span>No account</span><span>Tab data stays in your browser</span></div>
      <span class="sequence" id="sequence"></span>
    </footer>
    <p id="capture-status" role="status">Loading local screenshot and font…</p>
  </main>
  <script>
    const shots = "../source/appshots-2.4/";
    const slides = [
      {
        mode: "preview",
        headline: "See the page <em>before you switch.</em>",
        description: "Hover to look. Move away to return. Click to stay.",
        image: "live-browser.jpg",
        fallback: "01-preview.jpg",
        alt: "Actual Chrome page with the TabShow side panel previewing another open tab",
      },
      {
        eyebrow: "Search open tabs",
        headline: "Find the tab<br><em>you came for.</em>",
        description: "Type a title, website, or part of an address. The list narrows as you type.",
        extra: '<p class="detail">Search also finds tabs inside collapsed Chrome groups.</p>',
        image: "02-search.jpg",
        alt: "Actual TabShow search field and matching open tabs",
      },
      {
        mode: "ink",
        eyebrow: "Keyboard navigation",
        headline: "Type. Select.<br><em>Open.</em>",
        description: "Open the panel and start typing. Your current page stays put while you choose.",
        extra: '<ul class="steps"><li><kbd>↑ ↓</kbd><span><b>Select</b> a result</span></li><li><kbd>Enter</kbd><span><b>Open</b> the tab</span></li><li><kbd>Esc</kbd><span><b>Return</b> and close the panel</span></li></ul>',
        image: "03-keyboard.jpg",
        alt: "Actual TabShow list with a keyboard-selected result",
      },
      {
        eyebrow: "All windows",
        headline: "Another window?<br><em>Find it here.</em>",
        description: "Search every window in this Chrome profile. Click or press Enter to switch.",
        extra: '<p class="detail"><strong>Work and Personal profiles stay separate.</strong><br>Hovering never pulls another window forward.</p>',
        image: "04-windows.jpg",
        alt: "Actual TabShow All windows view separating tabs from different Chrome windows",
      },
      {
        eyebrow: "New panel settings",
        headline: "Choose a tab.<br><em>Keep the panel.</em>",
        description: "Leave the list open after a click or Enter. Turn it on in Settings when that fits your workflow.",
        extra: '<p class="setting-label">Keep panel open after choosing a tab</p><p class="detail">Off by default. Hover previews can also be turned off. Your sort choice stays saved.</p>',
        image: "05-settings.jpg",
        alt: "Actual TabShow Settings with Keep panel open after choosing a tab enabled",
      },
    ];
    const rawSlide = Number(new URLSearchParams(location.search).get("slide") || 1);
    const slideNumber = Number.isInteger(rawSlide) && rawSlide >= 1 && rawSlide <= slides.length ? rawSlide : 1;
    const slide = slides[slideNumber - 1];
    document.title = `TabShow 2.4 · Gallery ${slideNumber} of ${slides.length}`;
    document.getElementById("canvas").className = `canvas ${slide.mode || ""}`;
    document.getElementById("headline").innerHTML = slide.headline;
    document.getElementById("description").textContent = slide.description;
    document.getElementById("extra").innerHTML = slide.extra || "";
    document.getElementById("sequence").textContent = `${String(slideNumber).padStart(2, "0")} / 05`;
    const eyebrow = document.getElementById("eyebrow");
    eyebrow.textContent = slide.eyebrow || "";
    if (!slide.eyebrow) eyebrow.remove();
    if (slide.mode === "preview") document.getElementById("screenshot-frame").className = "screenshot browser-shot";
    const productImage = document.getElementById("product-image");
    productImage.alt = slide.alt;
    let usedFallback = false;
    const loadImage = new Promise((resolve, reject) => {
      productImage.addEventListener("load", () => resolve());
      productImage.addEventListener("error", () => {
        if (slide.fallback && !usedFallback) {
          usedFallback = true;
          productImage.alt = "Actual TabShow side panel showing a live preview selection";
          productImage.src = shots + slide.fallback;
        } else {
          reject(new Error(`Missing local screenshot: ${productImage.getAttribute("src")}`));
        }
      });
      productImage.src = shots + slide.image;
    });
    window.galleryReady = Promise.all([loadImage, document.fonts.ready]).then(() => {
      document.getElementById("capture-status").hidden = true;
      document.documentElement.dataset.captureReady = "true";
      document.documentElement.dataset.previewSource = usedFallback ? "panel-fallback" : "primary";
    }).catch((error) => {
      document.getElementById("capture-status").textContent = error.message;
      document.documentElement.dataset.captureReady = "error";
    });
  </script>
</body>
</html>
